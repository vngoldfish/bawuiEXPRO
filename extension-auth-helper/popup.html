<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>⚡ BAWUI EXTENSION PRO — vidIQ Vision</title>
    <link rel="stylesheet" type="text/css" href="popup.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 448px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        body.vidiq-active {
            background: #f1f5f9;
            color: #0f172a;
        }

        /* Top Nav Tabs */
        .top-tabs {
            display: flex;
            background: #0b1120;
            border-bottom: 2px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 9999;
        }
        .top-tab-btn {
            flex: 1;
            padding: 10px 12px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.15s ease;
        }
        .top-tab-btn:hover {
            color: #f1f5f9;
            background: rgba(255, 255, 255, 0.04);
        }
        .top-tab-btn.active {
            color: #38bdf8;
            border-bottom-color: #38bdf8;
            background: rgba(56, 189, 248, 0.08);
        }
        .top-tab-btn.tab-vidiq.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
            background: rgba(37, 99, 235, 0.08);
        }
        .top-tab-btn.tab-ai.active {
            color: #2dd4bf;
            border-bottom-color: #2dd4bf;
            background: rgba(45, 212, 191, 0.08);
        }

        /* Panes */
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
        }

        /* BAWUI Pane Content */
        #paneBawui {
            padding: 14px 16px 16px;
            background: #0f172a;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1e293b;
        }
        .title {
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 999px;
            background: #1e293b;
            border: 1px solid #334155;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }
        .dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .card {
            background: #1e293b;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .label {
            color: #94a3b8;
            font-size: 11px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .val {
            font-weight: 600;
            color: #f1f5f9;
            word-break: break-all;
        }
        .input-group {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        input.bawui-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        button.bawui-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        button.bawui-btn:hover { background: #0369a1; }
        .btn-full { width: 100%; padding: 8px; margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-secondary { background: #334155; }
        .btn-secondary:hover { background: #475569; }
        .btn-purple { background: #7c3aed; }
        .btn-purple:hover { background: #6d28d9; }
        .result-msg {
            font-size: 11px;
            margin-top: 6px;
            text-align: center;
            display: none;
        }

        /* vidIQ Pane */
        #paneVidiq {
            background: #f1f5f9;
            min-height: 480px;
        }
        #vidiq-popup-body {
            width: 448px;
            background-color: #f1f5f9;
        }

        /* AI Pane */
        #paneAi {
            padding: 14px 16px 16px;
            background: #0f172a;
        }
        #paneAi .ai-card {
            background: #1e293b;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        #paneAi .ai-card h3 {
            font-size: 13px;
            font-weight: 700;
            color: #2dd4bf;
            margin-bottom: 10px;
        }
        #paneAi label {
            font-size: 11px;
            color: #94a3b8;
            display: block;
            margin-bottom: 3px;
            margin-top: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #paneAi label:first-of-type { margin-top: 0; }
        #paneAi input, #paneAi select {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        #paneAi select { cursor: pointer; }
        #paneAi .ai-btn-row {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        #paneAi .ai-btn {
            flex: 1;
            background: #2dd4bf;
            color: #0f172a;
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
        }
        #paneAi .ai-btn:hover { background: #5eead4; }
        #paneAi .ai-btn-outline {
            flex: 1;
            background: transparent;
            color: #2dd4bf;
            border: 1px solid #2dd4bf;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
        }
        #paneAi .ai-btn-outline:hover { background: rgba(45,212,191,0.1); }
        #paneAi .ai-test-result {
            font-size: 11px;
            margin-top: 6px;
            text-align: center;
            min-height: 16px;
        }
        #paneAi .ai-action-btn {
            width: 100%;
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            transition: 0.15s;
        }
        #paneAi .ai-action-btn:hover { border-color: #2dd4bf; background: rgba(45,212,191,0.06); }
        #paneAi .ai-action-btn:disabled { opacity: 0.5; cursor: wait; }
        #paneAi #aiPopupResult {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px 12px;
            margin-top: 8px;
            font-size: 12px;
            line-height: 1.5;
            color: #e2e8f0;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <!-- Top Navigation Bar -->
    <div class="top-tabs">
        <button class="top-tab-btn active" id="tabBtnBawui">
            <span>⚡</span> <span>BAWUI Server</span>
        </button>
        <button class="top-tab-btn tab-vidiq" id="tabBtnVidiq">
            <span>📊</span> <span>vidIQ Vision</span>
        </button>
        <button class="top-tab-btn tab-ai" id="tabBtnAi">
            <span>🤖</span> <span>AI Analysis</span>
        </button>
    </div>

    <!-- PANE 1: BAWUI SERVER CONTROLS -->
    <div id="paneBawui" class="tab-pane active">
        <div class="header">
            <div>
                <div class="title" id="appTitle">⚡ BAWUI EXTENSION PRO</div>
                <div id="appDesc" style="font-size:10px; color:#94a3b8; margin-top:2px; max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Cầu nối VPS & Trình duyệt</div>
            </div>
            <div class="status-badge">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Offline</span>
                <span id="pingBadge" style="font-size:10px; color:#38bdf8;"></span>
            </div>
        </div>

        <div class="card">
            <div class="label">Node ID & Tên Máy</div>
            <div class="val" id="nodeId">Đang kết nối...</div>
            <div id="projectBadge" style="font-size:11px; color:#38bdf8; margin-top:4px; font-weight:600;">📁 Dự án: Đang đồng bộ...</div>
        </div>

        <div class="card">
            <div class="label">Địa Chỉ Máy Chủ (VPS URL)</div>
            <div class="input-group">
                <input type="text" id="backendUrl" class="bawui-input" value="http://127.0.0.1:9999" placeholder="http://ip:port hoặc https://domain" />
                <button id="btnSaveUrl" class="bawui-btn">Lưu</button>
            </div>
            <div id="saveResult" class="result-msg"></div>
        </div>

        <button class="bawui-btn btn-full" id="btnOpenDashboard">🚀 Mở Web Controller Trên VPS</button>
        <button class="bawui-btn btn-full btn-purple" id="btnOpenOptions">⚙️ Cài Đặt VPS / Server (Nâng cao)</button>
        <button class="bawui-btn btn-full btn-secondary" id="btnPing">🔍 Kiểm Tra Kết Nối (Ping)</button>
    </div>

    <!-- PANE 2: VIDIQ VISION INTERFACE -->
    <div id="paneVidiq" class="tab-pane">
        <div id="vidiq-popup-body"></div>
    </div>

    <!-- PANE 3: AI ANALYSIS -->
    <div id="paneAi" class="tab-pane">
        <!-- AI Config Card -->
        <div class="ai-card">
            <h3>⚙️ Cấu hình AI API</h3>
            <label>API URL</label>
            <input id="aiApiUrl" type="text" placeholder="https://your-vps.com/v1/chat/completions" />
            <label>API Key (tuỳ chọn)</label>
            <input id="aiApiKey" type="password" placeholder="sk-... hoặc để trống" />
            <label>Model</label>
            <input id="aiModel" type="text" placeholder="default" />
            <label>Ngôn ngữ kết quả</label>
            <select id="aiLanguage">
                <option value="vi">🇻🇳 Tiếng Việt</option>
                <option value="en">🇬🇧 English</option>
            </select>
            <div class="ai-btn-row">
                <button class="ai-btn" id="btnSaveAiConfig">💾 Lưu</button>
                <button class="ai-btn-outline" id="btnTestAi">🔗 Test kết nối</button>
            </div>
            <div class="ai-test-result" id="aiTestResult"></div>
        </div>

        <!-- Quick Analysis Card -->
        <div class="ai-card">
            <h3>📊 Phân tích nhanh (tab hiện tại)</h3>
            <p style="font-size:11px; color:#64748b; margin-bottom:10px;">
                Mở video YouTube → nhấn nút phân tích bên dưới
            </p>
            <button class="ai-action-btn" id="btnPopupAnalyzeVideo">
                <span>🎬</span> <span>Phân tích Video SEO</span>
            </button>
            <button class="ai-action-btn" id="btnPopupAnalyzeChannel">
                <span>📺</span> <span>Phân tích Kênh</span>
            </button>
            <button class="ai-action-btn" id="btnPopupSuggestContent">
                <span>💡</span> <span>Gợi ý Nội dung</span>
            </button>
            <div id="aiPopupResult" style="display:none;">
                <div id="aiPopupResultContent"></div>
            </div>
        </div>
    </div>

    <script src="popup_shield.js"></script>
    <script src="popup.bundle.js"></script>
    <script src="popup.js"></script>
</body>
</html>
