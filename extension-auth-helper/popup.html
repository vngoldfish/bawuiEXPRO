<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>⚡ BAWUI EXTENSION PRO — vidIQ Vision</title>
    <link rel="stylesheet" type="text/css" href="popup.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 360px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            transition: width 0.2s ease, background 0.2s ease;
        }
        body.vidiq-active {
            width: 448px;
            background: #f1f5f9;
            color: #0f172a;
        }

        /* Top Nav Tabs */
        .top-tabs {
            display: flex;
            background: #0b1120;
            border-bottom: 2px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 9999;
        }
        .top-tab-btn {
            flex: 1;
            padding: 10px 12px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.15s ease;
        }
        .top-tab-btn:hover {
            color: #f1f5f9;
            background: rgba(255, 255, 255, 0.04);
        }
        .top-tab-btn.active {
            color: #38bdf8;
            border-bottom-color: #38bdf8;
            background: rgba(56, 189, 248, 0.08);
        }
        .top-tab-btn.tab-vidiq.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
            background: rgba(37, 99, 235, 0.08);
        }

        /* Panes */
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
        }

        /* BAWUI Pane Content */
        #paneBawui {
            padding: 14px 16px 16px;
            background: #0f172a;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1e293b;
        }
        .title {
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 999px;
            background: #1e293b;
            border: 1px solid #334155;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }
        .dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .card {
            background: #1e293b;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .label {
            color: #94a3b8;
            font-size: 11px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .val {
            font-weight: 600;
            color: #f1f5f9;
            word-break: break-all;
        }
        .input-group {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        input.bawui-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        button.bawui-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        button.bawui-btn:hover { background: #0369a1; }
        .btn-full { width: 100%; padding: 8px; margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-secondary { background: #334155; }
        .btn-secondary:hover { background: #475569; }
        .btn-purple { background: #7c3aed; }
        .btn-purple:hover { background: #6d28d9; }
        .result-msg {
            font-size: 11px;
            margin-top: 6px;
            text-align: center;
            display: none;
        }

        /* vidIQ Pane */
        #paneVidiq {
            background: #f1f5f9;
            min-height: 480px;
        }
        #vidiq-popup-body {
            width: 448px;
            background-color: #f1f5f9;
        }
    </style>
</head>
<body>
    <!-- Top Navigation Bar -->
    <div class="top-tabs">
        <button class="top-tab-btn active" id="tabBtnBawui">
            <span>⚡</span> <span>BAWUI Server</span>
        </button>
        <button class="top-tab-btn tab-vidiq" id="tabBtnVidiq">
            <span>📊</span> <span>vidIQ Vision</span>
        </button>
    </div>

    <!-- PANE 1: BAWUI SERVER CONTROLS -->
    <div id="paneBawui" class="tab-pane active">
        <div class="header">
            <div>
                <div class="title" id="appTitle">⚡ BAWUI EXTENSION PRO</div>
                <div id="appDesc" style="font-size:10px; color:#94a3b8; margin-top:2px; max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Cầu nối VPS & Trình duyệt</div>
            </div>
            <div class="status-badge">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Offline</span>
                <span id="pingBadge" style="font-size:10px; color:#38bdf8;"></span>
            </div>
        </div>

        <div class="card">
            <div class="label">Node ID & Tên Máy</div>
            <div class="val" id="nodeId">Đang kết nối...</div>
            <div id="projectBadge" style="font-size:11px; color:#38bdf8; margin-top:4px; font-weight:600;">📁 Dự án: Đang đồng bộ...</div>
        </div>

        <div class="card">
            <div class="label">Địa Chỉ Máy Chủ (VPS URL)</div>
            <div class="input-group">
                <input type="text" id="backendUrl" class="bawui-input" value="http://127.0.0.1:9999" placeholder="http://ip:port hoặc https://domain" />
                <button id="btnSaveUrl" class="bawui-btn">Lưu</button>
            </div>
            <div id="saveResult" class="result-msg"></div>
        </div>

        <button class="bawui-btn btn-full" id="btnOpenDashboard">🚀 Mở Web Controller Trên VPS</button>
        <button class="bawui-btn btn-full btn-purple" id="btnOpenOptions">⚙️ Cài Đặt VPS / Server (Nâng cao)</button>
        <button class="bawui-btn btn-full btn-secondary" id="btnPing">🔍 Kiểm Tra Kết Nối (Ping)</button>
    </div>

    <!-- PANE 2: VIDIQ VISION INTERFACE -->
    <div id="paneVidiq" class="tab-pane">
        <div id="vidiq-popup-body"></div>
    </div>

    <script src="popup.bundle.js"></script>
    <script src="popup.js"></script>
</body>
</html>
