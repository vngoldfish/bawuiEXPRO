version: '3.8'

services:
  autopostfb:
    build: .
    container_name: autopostfb
    restart: always
    ports:
      - "127.0.0.1:9999:9999"
    volumes:
      # Giữ lại dữ liệu projects và config trên máy chủ khi container restart/rebuild
      - ./projects.json:/app/projects.json
      - ./bridge_config.json:/app/bridge_config.json
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
    networks:
      - bawui-net

networks:
  bawui-net:
    external: true
