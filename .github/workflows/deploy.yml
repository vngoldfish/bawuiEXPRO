name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key & Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '64.110.106.110' }}
          VPS_USER: ${{ secrets.VPS_USER || secrets.VPS_USERNAME || 'ubuntu' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.vps_ssh_key }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Chưa cấu hình Secret 'VPS_SSH_KEY' trong GitHub Repository Settings!"
            echo "Vui lòng vào Settings -> Secrets and variables -> Actions -> Thêm Secret 'VPS_SSH_KEY'!"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf "%s\n" "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "🚀 [CI/CD] Connecting to $VPS_USER@$VPS_HOST:$VPS_PORT..."

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o HostkeyAlgorithms=+ssh-rsa \
            -p $VPS_PORT \
            $VPS_USER@$VPS_HOST << 'ENDSSH'
              set -e

              echo "🚀 [CI/CD] Connected to VPS successfully!"
              
              if [ -d "/opt/apps/bawuiEXPRO" ]; then
                cd /opt/apps/bawuiEXPRO
              elif [ -d "/var/www/ex.bawui.com" ]; then
                cd /var/www/ex.bawui.com
              else
                echo "❌ Không tìm thấy thư mục dự án trên VPS!"
                exit 1
              fi

              echo "📥 Fetching latest code from GitHub..."
              git fetch origin main
              git reset --hard origin/main

              echo "🐳 Rebuilding and updating Docker container bawuiEXPRO..."
              docker compose build
              docker compose up -d --remove-orphans

              echo "🧹 Cleaning up old unused Docker images..."
              docker image prune -f

              echo "✅ [CI/CD] Auto Deploy hoàn tất thành công! https://ex.bawui.com is live!"
          ENDSSH
