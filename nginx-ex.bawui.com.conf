# Cấu hình Nginx Reverse Proxy cho tên miền ex.bawui.com
# Copy file này vào: /etc/nginx/sites-available/ex.bawui.com
# Sau đó tạo symlink: sudo ln -s /etc/nginx/sites-available/ex.bawui.com /etc/nginx/sites-enabled/
# Kiểm tra: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name ex.bawui.com;

    client_max_body_size 120M;

    location / {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout cho các tác vụ upload video lớn và streaming
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
